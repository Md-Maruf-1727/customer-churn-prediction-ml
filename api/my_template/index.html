<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Churn Predictor</title>

<style>
body {
    font-family: Arial;
    background: #eef2f7;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

label {
    margin-top: 10px;
    display: block;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #007bff;
    color: white;
    border: none;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="container">

<h2>Customer Churn Prediction</h2>

<!-- BASIC INFO -->
<label>Gender</label>
<select id="gender">
    <option>Male</option>
    <option>Female</option>
</select>

<label>Senior Citizen</label>
<select id="senior">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Partner</label>
<select id="partner">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Dependents</label>
<select id="dependents">
    <option>Yes</option>
    <option>No</option>
</select>

<!-- SERVICE INFO -->
<label>Phone Service</label>
<select id="phone">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Multiple Lines</label>
<select id="multiple">
    <option>Yes</option>
    <option>No</option>
    <option>No phone service</option>
</select>

<label>Internet Service</label>
<select id="internet">
    <option>DSL</option>
    <option>Fiber optic</option>
    <option>No</option>
</select>

<label>Online Security</label>
<select id="security">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Online Backup</label>
<select id="backup">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Device Protection</label>
<select id="device">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Tech Support</label>
<select id="tech">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Streaming TV</label>
<select id="tv">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Streaming Movies</label>
<select id="movie">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Contract</label>
<select id="contract">
    <option>Month-to-month</option>
    <option>One year</option>
    <option>Two year</option>
</select>

<label>Paperless Billing</label>
<select id="paper">
    <option>Yes</option>
    <option>No</option>
</select>

<label>Payment Method</label>
<select id="payment">
    <option>Electronic check</option>
    <option>Mailed check</option>
    <option>Credit card (automatic)</option>
</select>

<!-- NUMERIC -->
<label>Tenure</label>
<input id="tenure" type="number">

<label>Monthly Charges</label>
<input id="monthly" type="number">

<label>Total Charges</label>
<input id="total" type="number">

<button onclick="predict()">Predict</button>

<div class="result" id="result"></div>

</div>

<script>
async function predict() {

    const data = {
        gender: document.getElementById("gender").value,
        SeniorCitizen: Number(document.getElementById("senior").value),
        Partner: document.getElementById("partner").value,
        Dependents: document.getElementById("dependents").value,
        tenure: Number(document.getElementById("tenure").value),
        PhoneService: document.getElementById("phone").value,
        MultipleLines: document.getElementById("multiple").value,
        InternetService: document.getElementById("internet").value,
        OnlineSecurity: document.getElementById("security").value,
        OnlineBackup: document.getElementById("backup").value,
        DeviceProtection: document.getElementById("device").value,
        TechSupport: document.getElementById("tech").value,
        StreamingTV: document.getElementById("tv").value,
        StreamingMovies: document.getElementById("movie").value,
        Contract: document.getElementById("contract").value,
        PaperlessBilling: document.getElementById("paper").value,
        PaymentMethod: document.getElementById("payment").value,
        MonthlyCharges: Number(document.getElementById("monthly").value),
        TotalCharges: Number(document.getElementById("total").value)
    };

    const response = await fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    let label = result.result;

    document.getElementById("result").innerHTML =
        "Prediction: <b>" + label + "</b>";
}
</script>

</body>
</html>
